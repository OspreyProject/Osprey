    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title></title>
    <link rel="stylesheet" href="../theme.css">
    <link rel="stylesheet" href="settings-page.css">
    <script src="../../shared/theme-controller.js" type="text/javascript"></script>
    <script defer src="../../shared/browser-api.js" type="text/javascript"></script>
    <script defer src="../../shared/lang-util.js" type="text/javascript"></script>
    <script defer src="../../platform/message-bus.js" type="text/javascript"></script>
    <script defer src="../../providers/provider-groups.js" type="text/javascript"></script>
    <script defer src="../../providers/proxy-builtins.js" type="text/javascript"></script>
    <script defer src="../../providers/direct-integrations.js" type="text/javascript"></script>
    <script defer src="../../catalog/catalog-validator.js" type="text/javascript"></script>
    <script defer src="../../providers/provider-catalog.js" type="text/javascript"></script>
    <script defer src="../../state/provider-state-store.js" type="text/javascript"></script>
    <script defer src="../../state/policy-service.js" type="text/javascript"></script>
    <script defer src="../../platform/protection-result.js" type="text/javascript"></script>
    <script defer src="../../providers/provider-runtime-factory.js" type="text/javascript"></script>
    <script defer src="../../platform/url-service.js" type="text/javascript"></script>
    <script defer src="../../shared/lang-util.js" type="text/javascript"></script>
    <script defer src="ui/form-helpers.js" type="text/javascript"></script>
    <script defer src="ui/toast.js" type="text/javascript"></script>
    <script defer src="ui/provider-card.js" type="text/javascript"></script>

    <script defer src="settings-page.js" type="text/javascript"></script>
</head>

<body id="background" class="gray">
<header id="banner" class="banner">
    <img id="logo" class="logo" src="../../assets/osprey/icon128.png" alt="">
    <div class="banner-text-group">
        <h1 class="banner-heading">
            <a id="bannerLink" class="bannerText" href="https://osprey.ac"
               target="_blank" rel="noopener noreferrer" referrerpolicy="no-referrer">
                <!-- Automatically translated -->
            </a>
        </h1>
    </div>
    <a id="supportLink" class="support-link" href="https://ko-fi.com/ospreyproject"
       target="_blank" rel="noopener noreferrer" referrerpolicy="no-referrer"
       aria-label="Support Osprey on Ko-fi" title="Support Osprey on Ko-fi">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
    </a>
    <button id="themeToggle" type="button" class="theme-toggle" aria-label="Switch between light and dark theme">
        <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
        <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24"
             fill="currentColor" aria-hidden="true">
            <path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/>
        </svg>
    </button>
</header>

<div class="settings-layout">
    <nav id="settingsNav" class="settings-nav" aria-label="Settings sections"></nav>
    <main class="settings-main">
        <section id="page-providers" class="settings-page" data-page="providers">
            <div id="providerList"></div>
        </section>
        <section id="page-exclusions" class="settings-page" data-page="exclusions" hidden>
            <div id="exclusionsList"></div>
        </section>
        <section id="page-about" class="settings-page" data-page="about" hidden>
            <div id="aboutList"></div>
        </section>
    </main>
</div>
</body>
</html>
